# Miloco Server Configuration
# Unified management of all server configuration items

# Directory path configuration
# Storage directory can be overridden by environment variable MILOCO_SERVER_STORAGE_DIR
# Default to relative path for portability
directories:
  templates: "templates"
  static: "static"
  storage: ".temp"  # Can be overridden by MILOCO_SERVER_STORAGE_DIR env var

# Database configuration
database:
  path: "miloco.db"
  timeout: 30.0 
  check_same_thread: false
  isolation_level: null

# Server configuration
server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"
  enable_console_logging: true
  enable_file_logging: true

# Application information configuration
app:
  title: "Miloco server"
  service_name: "miloco-server"
  description: "Miloco server, responsible for scheduling various modules"
  version: "0.0.1"

# JWT authentication configuration
jwt:
  secret_key: "your-super-secret-key-change-this"  # Get from environment variable SECRET_KEY, default to this value
  algorithm: "HS256"
  access_token_expire_minutes: 1440  #minutes

# Local model configuration
local_model:
  host: "0.0.0.0"
  port: 8001

# Chat configuration
chat:
  agent_max_steps: 15  # Increased from 10 to 15 for complex multi-platform queries
  vision_use_img_count: 6
  chat_history_ttl: 30 #days
  use_ahaa: true  # Enable AHAA (Adaptive Hybrid Agent Architecture)

# Trigger rule runner configuration
trigger_rule_runner:
  interval_seconds: 2
  vision_use_img_count: 6
  trigger_rule_log_ttl: 30 #days

# Camera configuration
camera:
  frame_interval: 500 # Unit: Millisecond (ms)
  # Video quality for camera stream
  # Options: LOW (1) for low resolution, HIGH (3) for original/high resolution
  # LOW is more efficient, HIGH uses original camera resolution
  video_quality: HIGH
  # AI vision analysis image resolution (width)
  # When video_quality is HIGH, decoded frames will be resized to this width for AI analysis
  # Set to 0 to use original resolution (not recommended for HIGH quality)
  # Default: 640 (suitable for most AI analysis, reduces bandwidth and processing cost)
  vision_img_resolution: 640
  rtsp_server:
    enabled: true  # Enable/disable RTSP server
    port: 8554     # RTSP server port
    # RTSP URL format: rtsp://<server_ip>:{port}/<camera_did>

# Real-time detection configuration (YOLO / ONNXRuntime)
detection:
  enabled: true
  # Backend selection:
  # - auto: prefer CUDA -> DirectML -> OpenVINO -> CoreML -> CPU
  # - cpu / cuda / directml(dml) / openvino / mps(coreml)
  device: "auto"
  confidence_threshold: 0.5
  iou_threshold: 0.45
  half_precision: true
  # Stream settings
  process_fps: 5.0
  min_detection_interval: 0.5
  enable_tracking: true

rtsp_cameras:
  # Example RTSP camera configuration. Remove or duplicate entries as needed.
  - did: "ip_camera_1"
    name: "ip_camera_1"
    rtsp_url: "rtsp://192.168.3.122:8554/live/0"
    enable_audio: false
    transport: "udp"  # tcp/udp
    home_name: "家"
    room_name: "客厅"


# MIoT configuration, default to 'cn', use your MiHome cloud server
  # 'cn': '中国大陆'
  # 'de': 'Europe'
  # 'i2': 'India'
  # 'ru': 'Russia'
  # 'sg': 'Singapore'
  # 'us': 'United States
# Recording configuration
recording:
  enabled: true
  segment_duration: 300          # Recording segment duration in seconds (default 5 minutes)
  retention_days: 7              # Default retention days for recordings
  motion_buffer_seconds: 25      # Continue recording after motion stops (seconds)
  person_buffer_seconds: 30      # Continue recording after person leaves (seconds)
  motion_check_interval: 1.0     # Motion detection check interval (seconds)
  motion_threshold: 5            # DHash distance threshold for motion detection

miot:
  cloud_server: "cn"

# Habit learning configuration
habit_learning:
  enabled: true
  collector:
    flush_interval: 5
    noise_filter:
      ignore_states: ["unavailable", "unknown", "none"]
      ignore_entities:
        - "sensor.heartbeat"
        - "sensor.storage_used"
  learner:
    learn_interval: 3600
    min_occurrences: 3
    time_bucket_minutes: 30
  decision_engine:
    enabled: false
    cycle_interval: 60
    confidence_threshold: 0.65
    risk_level_limit: "HIGH"
  data_retention:
    events_days: 90  # 事件数据保留天数（默认90天）
    patterns_days: 180  # 行为模式保留天数（默认180天）
    cleanup_interval: 86400  # 清理间隔（秒），默认24小时

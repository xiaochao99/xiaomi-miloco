name: Build Docker Images

on:
  # push:
  #   tags:
  #     - "v*"
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      build-backend:
        description: 'Build backend image'
        type: boolean
        default: true
      build-ai-engine:
        description: 'Build AI engine image'
        type: boolean
        default: true

env:
  # GitHub Container Registry
  DOCKER_REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
      lowercase-owner: ${{ steps.lowercase.outputs.LOWERCASE_OWNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set version tag
        id: vars
        run: |
          if [[ "${GITEA_REF_TYPE}" == "tag" ]]; then
            VERSION=${GITEA_REF_NAME}
          elif [[ "${GITEA_REF}" == "refs/heads/main" ]]; then
            VERSION=latest
          else
            VERSION=dev
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set lowercase GitHub username
        id: lowercase
        run: |
          # 使用 Secrets 中的 GitHub 用户名，或从环境变量获取
          LOWERCASE_OWNER=$(echo "${{ secrets.GHCR_USERNAME || gitea.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWERCASE_OWNER=$LOWERCASE_OWNER" >> $GITHUB_OUTPUT

  build-ai-engine:
    needs: setup
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.build-ai-engine || gitea.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Docker CLI and dependencies
        run: |
          if which apt-get; then
            apt-get update && apt-get install -y docker.io curl ca-certificates
          elif which apk; then
            apk add docker-cli curl ca-certificates
          elif which yum; then
            yum install -y docker curl ca-certificates
          fi

      - name: Install Node.js if needed
        run: |
          if ! which npm; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ai_engine to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/ai_engine.cuda.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-ai_engine:${{ needs.setup.outputs.version }}

  build-backend:
    needs: setup
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.build-backend || gitea.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Docker CLI and dependencies
        run: |
          if which apt-get; then
            apt-get update && apt-get install -y docker.io curl ca-certificates
          elif which apk; then
            apk add docker-cli curl ca-certificates
          elif which yum; then
            yum install -y docker curl ca-certificates
          fi

      - name: Install Node.js if needed
        run: |
          if ! which npm; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend to GHCR (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-backend:${{ needs.setup.outputs.version }}
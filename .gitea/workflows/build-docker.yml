name: Build Docker Images

on:
  # push:
  #   tags:
  #     - "v*"
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      build-backend:
        description: 'Build backend image'
        type: boolean
        default: true
      build-ai-engine:
        description: 'Build AI engine image'
        type: boolean
        default: true

env:
  # Gitea Registry 地址，可通过 Secrets 配置
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'gitea.hypernas.cn:2443' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
      lowercase-owner: ${{ steps.lowercase.outputs.LOWERCASE_OWNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set version tag
        id: vars
        run: |
          if [[ "${GITEA_REF_TYPE}" == "tag" ]]; then
            VERSION=${GITEA_REF_NAME}
          elif [[ "${GITEA_REF}" == "refs/heads/main" ]]; then
            VERSION=latest
          else
            VERSION=dev
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set lowercase repository owner
        id: lowercase
        run: |
          LOWERCASE_OWNER=$(echo "${{ gitea.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWERCASE_OWNER=$LOWERCASE_OWNER" >> $GITHUB_OUTPUT

  build-ai-engine:
    needs: setup
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.build-ai-engine || gitea.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Docker CLI and dependencies
        run: |
          if which apt-get; then
            apt-get update && apt-get install -y docker.io curl ca-certificates
          elif which apk; then
            apk add docker-cli curl ca-certificates
          elif which yum; then
            yum install -y docker curl ca-certificates
          fi

      - name: Install Node.js if needed
        run: |
          if ! which npm; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          fi

      - name: Configure Docker for insecure registry
        run: |
          mkdir -p /etc/docker
          echo '{ "insecure-registries": ["gitea.hypernas.cn:2443"] }' > /etc/docker/daemon.json
          systemctl restart docker || true

      - name: Log in to Gitea Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ai_engine
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/ai_engine.cuda.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-ai_engine:${{ needs.setup.outputs.version }}

  build-backend:
    needs: setup
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.build-backend || gitea.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Docker CLI and dependencies
        run: |
          if which apt-get; then
            apt-get update && apt-get install -y docker.io curl ca-certificates
          elif which apk; then
            apk add docker-cli curl ca-certificates
          elif which yum; then
            yum install -y docker curl ca-certificates
          fi

      - name: Install Node.js if needed
        run: |
          if ! which npm; then
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          fi

      - name: Configure Docker for insecure registry
        run: |
          mkdir -p /etc/docker
          echo '{ "insecure-registries": ["gitea.hypernas.cn:2443"] }' > /etc/docker/daemon.json
          systemctl restart docker || true

      - name: Log in to Gitea Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-backend:${{ needs.setup.outputs.version }}
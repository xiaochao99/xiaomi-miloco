name: Build Docker Images

on:
  # push:
  #   tags:
  #     - "v*"
  #   branches:
  #     - main
  workflow_dispatch:
    inputs:
      build-backend:
        description: 'Build backend image'
        type: boolean
        default: true
      build-ai-engine:
        description: 'Build AI engine image'
        type: boolean
        default: true
      version-tag:
        description: 'Custom version tag (leave empty to auto-detect)'
        type: string
        default: ''

env:
  # GitHub Container Registry
  DOCKER_REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
      lowercase-owner: ${{ steps.lowercase.outputs.LOWERCASE_OWNER }}
    steps:
      - name: Install Node.js
        run: |
          if which apt-get; then
            apt-get update && apt-get install -y curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          elif which apk; then
            apk add curl ca-certificates nodejs npm
          elif which yum; then
            yum install -y curl ca-certificates nodejs npm
          fi

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set version tag
        id: vars
        run: |
          # 如果用户手动指定了版本标签，优先使用
          if [[ -n "${{ gitea.event.inputs.version-tag }}" ]]; then
            VERSION="${{ gitea.event.inputs.version-tag }}"
          elif [[ "${GITEA_REF_TYPE}" == "tag" ]]; then
            VERSION=${GITEA_REF_NAME}
          elif [[ "${GITEA_REF}" == "refs/heads/main" ]]; then
            VERSION=latest
          else
            # 从 git 历史中获取最近的 tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [[ -n "$LATEST_TAG" ]]; then
              VERSION=$LATEST_TAG
            else
              VERSION=dev
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set lowercase GitHub username
        id: lowercase
        run: |
          LOWERCASE_OWNER=$(echo "${{ secrets.GHCR_USERNAME || gitea.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWERCASE_OWNER=$LOWERCASE_OWNER" >> $GITHUB_OUTPUT

  build-ai-engine:
    needs: setup
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.build-ai-engine || gitea.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies (including Node.js)
        run: |
          if which apt-get; then
            apt-get update && apt-get install -y docker.io curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          elif which apk; then
            apk add docker-cli curl ca-certificates nodejs npm
          elif which yum; then
            yum install -y docker curl ca-certificates nodejs npm
          fi

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ai_engine to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/ai_engine.cuda.Dockerfile
          push: true
          build-args: |
            FACE_BACKEND=cuda
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-ai_engine:${{ needs.setup.outputs.version }}
          cache-from: |
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-ai_engine:buildcache
          cache-to: |
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-ai_engine:buildcache,mode=max

  build-backend:
    needs: setup
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.build-backend || gitea.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies (including Node.js)
        run: |
          if which apt-get; then
            apt-get update && apt-get install -y docker.io curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          elif which apk; then
            apk add docker-cli curl ca-certificates nodejs npm
          elif which yum; then
            yum install -y docker curl ca-certificates nodejs npm
          fi

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend to GHCR (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-backend:${{ needs.setup.outputs.version }}
          cache-from: |
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-backend:buildcache
          cache-to: |
            type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-backend:buildcache,mode=max
name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      build-backend:
        description: 'Build backend image'
        type: boolean
        default: true
      build-ai-engine:
        description: 'Build AI engine image'
        type: boolean
        default: true
      version-tag:
        description: 'Custom version tag (leave empty to auto-detect)'
        type: string
        default: ''

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.VERSION }}
      lowercase-owner: ${{ steps.lowercase.outputs.LOWERCASE_OWNER }}
    steps:
      - name: Install Node.js
        run: |
          if which apt-get; then
            sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
            sed -i 's/security.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
            apt-get update && apt-get install -y curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          elif which apk; then
            sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
            apk update
            apk add ca-certificates curl nodejs npm
          elif which yum; then
            sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*
            sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://mirrors.aliyun.com|g' /etc/yum.repos.d/CentOS-*
            yum install -y curl ca-certificates nodejs npm
          fi

      - name: Checkout
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
          git config --global http.timeout 30
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git init
          REPO_URL="${{ gitea.server_url }}/${{ gitea.repository }}.git"
          AUTH_URL=$(echo "$REPO_URL" | sed "s|://|://token:${{ gitea.token }}@|")
          git remote add origin "$AUTH_URL"
          echo "Fetching from: $REPO_URL"
          echo "Ref: ${{ gitea.ref }}"
          timeout 60 git fetch --depth=1 origin "${{ gitea.ref }}" || timeout 60 git fetch origin "${{ gitea.ref }}"
          git checkout "${{ gitea.sha }}"

      - name: Set version tag
        id: vars
        run: |
          if [[ -n "${{ gitea.event.inputs.version-tag }}" ]]; then
            VERSION="${{ gitea.event.inputs.version-tag }}"
          elif [[ "${GITEA_REF_TYPE}" == "tag" ]]; then
            VERSION=${GITEA_REF_NAME}
          elif [[ "${GITEA_REF}" == "refs/heads/main" ]]; then
            VERSION=latest
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [[ -n "$LATEST_TAG" ]]; then
              VERSION=$LATEST_TAG
            else
              VERSION=dev
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set lowercase repo owner
        id: lowercase
        run: |
          LOWERCASE_OWNER=$(echo "${{ secrets.GHCR_USERNAME || gitea.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "LOWERCASE_OWNER=$LOWERCASE_OWNER" >> $GITHUB_OUTPUT

  build-ai-engine:
    needs: setup
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.build-ai-engine || gitea.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          if which apt-get; then
            sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
            sed -i 's/security.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
            apt-get update && apt-get install -y docker.io curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          elif which apk; then
            sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
            apk update
            apk add ca-certificates docker-cli curl nodejs npm
          elif which yum; then
            sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*
            sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://mirrors.aliyun.com|g' /etc/yum.repos.d/CentOS-*
            yum install -y docker curl ca-certificates nodejs npm
          fi

      - name: Checkout
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
          git config --global http.timeout 30
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git init
          REPO_URL="${{ gitea.server_url }}/${{ gitea.repository }}.git"
          AUTH_URL=$(echo "$REPO_URL" | sed "s|://|://token:${{ gitea.token }}@|")
          git remote add origin "$AUTH_URL"
          echo "Fetching from: $REPO_URL"
          echo "Ref: ${{ gitea.ref }}"
          timeout 60 git fetch --depth=1 origin "${{ gitea.ref }}" || timeout 60 git fetch origin "${{ gitea.ref }}"
          git checkout "${{ gitea.sha }}"

      - name: Build and push ai_engine to GHCR
        run: |
          docker build \
            --file docker/ai_engine.cuda.Dockerfile \
            --build-arg DOCKER_REGISTRY=registry.cn-hangzhou.aliyuncs.com \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-ai_engine:${{ needs.setup.outputs.version }} \
            .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-ai_engine:${{ needs.setup.outputs.version }}

  build-backend:
    needs: setup
    if: ${{ gitea.event_name == 'workflow_dispatch' && inputs.build-backend || gitea.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          if which apt-get; then
            sed -i 's/archive.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
            sed -i 's/security.ubuntu.com/mirrors.aliyun.com/g' /etc/apt/sources.list
            apt-get update && apt-get install -y docker.io curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs
          elif which apk; then
            sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
            apk update
            apk add ca-certificates docker-cli curl nodejs npm
          elif which yum; then
            sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*
            sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://mirrors.aliyun.com|g' /etc/yum.repos.d/CentOS-*
            yum install -y docker curl ca-certificates nodejs npm
          fi

      - name: Checkout
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false
          git config --global http.timeout 30
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          git init
          REPO_URL="${{ gitea.server_url }}/${{ gitea.repository }}.git"
          AUTH_URL=$(echo "$REPO_URL" | sed "s|://|://token:${{ gitea.token }}@|")
          git remote add origin "$AUTH_URL"
          echo "Fetching from: $REPO_URL"
          echo "Ref: ${{ gitea.ref }}"
          timeout 60 git fetch --depth=1 origin "${{ gitea.ref }}" || timeout 60 git fetch origin "${{ gitea.ref }}"
          git checkout "${{ gitea.sha }}"

      - name: Build and push backend to GHCR
        run: |
          docker build \
            --file docker/backend.Dockerfile \
            --build-arg PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/ \
            --build-arg DOCKER_REGISTRY=registry.cn-hangzhou.aliyuncs.com \
            --tag ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-backend:${{ needs.setup.outputs.version }} \
            .
          docker push ${{ env.DOCKER_REGISTRY }}/${{ needs.setup.outputs.lowercase-owner }}/miloco-backend:${{ needs.setup.outputs.version }}
